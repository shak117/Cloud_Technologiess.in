<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="100%" height="100%">
  <defs>
    <linearGradient id="punitaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#9A7718" />
    </linearGradient>
    <linearGradient id="punitaMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1326" />
      <stop offset="100%" stop-color="#4E0513" />
    </linearGradient>
  </defs>

  <!-- Elegant Boutique Emblem -->
  <g transform="translate(8, 8)">
    <!-- Outer decorative diamond/crest -->
    <rect x="6" y="6" width="48" height="48" rx="8" transform="rotate(45 30 30)" fill="#FFF5F7" stroke="url(#punitaGold)" stroke-width="1.8"/>
    <!-- Stylized Traditional Paisley / Lotus Motif -->
    <path d="M 30,15 C 33,22 41,27 41,34 C 41,41 35,46 30,46 C 25,46 19,41 19,34 C 19,27 27,22 30,15 Z" fill="url(#punitaMaroon)"/>
    <circle cx="30" cy="32" r="3.5" fill="url(#punitaGold)"/>
    <path d="M 24,35 Q 30,42 36,35" stroke="url(#punitaGold)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Typography -->
  <g transform="translate(78, 14)">
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="22" font-weight="700" fill="#4E0513" letter-spacing="3.5">
      PUNITA
    </text>
    <text x="0" y="42" font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#9A7718" letter-spacing="3">
      COLLECTION &bull; SATARA
    </text>
    <text x="0" y="55" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="500" fill="#64748B" letter-spacing="1">
      Boutique &bull; Ethnic &bull; Western Wear
    </text>
  </g>
</svg>